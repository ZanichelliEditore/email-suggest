default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=4096]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      # The hook above scans only the staged diff. `make gitleaks` also runs
      # this one, at the same pin: every commit's content.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
        always_run: true
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.24
    hooks:
      - id: actionlint
        files: ^\.github/workflows/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^tools/.*\.py$
      - id: ruff-format
        files: ^tools/.*\.py$
  - repo: local
    hooks:
      - id: rfc-status
        name: rfc status -> folder sync
        entry: python3 tools/checks/sync_rfc_status.py
        language: system
        pass_filenames: false
        files: ^docs/rfc/.*\.md$
  - repo: local
    hooks:
      # Check-only, the same `make biome` the gate runs: a commit that passes
      # the hook passes Biome in `make quality`. `make format` fixes.
      - id: biome
        name: biome check (dev container)
        entry: make biome
        language: system
        pass_filenames: false
        # .editorconfig sets Biome's indent (biome.json useEditorconfig).
        files: ^(src/|test/|pack-smoke/|consumer-check/|examples/|[^/]+\.json$|\.editorconfig$)
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: tools-checks-tests
        name: tools/checks tests (pre-push)
        entry: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE python3 -m unittest discover -s tools/checks
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
