name: quality
on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run on the same PR; keep every push/main run (run_id is unique).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # so gitleaks-history (make gitleaks) scans every commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The host side of the gate; the JS side runs in the dev container
      # (SPEC §8), whose Dockerfile pins Node.
      - run: pipx install ruff
      - run: pipx install pre-commit
      - run: make quality
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits via the API; 403s without it
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # required for organization repos
          GITLEAKS_ENABLE_COMMENTS: "false"
