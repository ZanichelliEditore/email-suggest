name: publish
# SPEC §9: only CI publishes, and only from a release tag.
on:
  push:
    tags: ["v*.*.*"]

# A second push of the same tag waits instead of racing the first upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; each job names its own (RFC 2026-10-06-publish-to-npm,
# Decision 7): only `publish`, which runs no repo code, can request an OIDC
# token, the only npm credential (T-017).
permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # so gitleaks-history (make gitleaks) scans every commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # 1. The tag names package.json's version.
      - run: python3 tools/checks/check_tag_version.py "$GITHUB_REF_NAME"
      # 2 and 3. The gate, as in quality.yml. Its pack-smoke step builds dist/,
      # packs it into .pack/ and tests that tarball.
      - run: pipx install ruff
      - run: pipx install pre-commit
      - run: make quality
      # Hand the tested tarball to `publish`.
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: .pack/*.tgz
          include-hidden-files: true # .pack is a dot directory; skipped otherwise
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing (OIDC) and npm provenance
    # No checkout: this job runs no repo code and reads no repo .npmrc.
    steps:
      # Fails on a digest mismatch (download-artifact v8 default), so this is
      # the tarball `gate` uploaded.
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: tarball
      # 4. Publish that tarball to the public npm registry (RFC
      # 2026-10-06-publish-to-npm, Decision 1). npm runs on the runner, not
      # in the dev container, because it needs the runner's OIDC variables;
      # setup-node's Node only sends a finished tarball. The gate and the
      # tarball still use the Dockerfile's Node (SPEC §8).
      - uses: actions/setup-node@v7
        with:
          node-version: "24" # the Dockerfile's major
          registry-url: https://registry.npmjs.org
      # OIDC alone authenticates: no token exists (RFC Decision 3.4, T-017).
      - name: publish to npm
        # The name/version check catches an honest mismatch (wrong tag, stale
        # tarball), not a crafted tarball (RFC Decision 7).
        run: |
          set -- ./tarball/*.tgz # "./": npm reads "dir/x.tgz" as a GitHub repo
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one tarball, got: $*" >&2; exit 1; }
          want="@zanichelli/email-suggest@${GITHUB_REF_NAME#v}"
          got=$(tar -xzOf "$1" package/package.json | jq -r '.name + "@" + .version')
          [ "$got" = "$want" ] || { echo "tarball is $got, tag wants $want" >&2; exit 1; }
          npm publish "$1" --access public --provenance --ignore-scripts
