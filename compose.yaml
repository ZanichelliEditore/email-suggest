services:
  dev:
    build: .
    # The host's UID:GID, exported by the Makefile, so files the container
    # writes into the repo (dist/, the lockfile) are owned by the host user.
    # A bare `docker compose run` falls back to 1000, the image's `node` user.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh

volumes:
  node_modules:
